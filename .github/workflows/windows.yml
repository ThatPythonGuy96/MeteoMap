name: Build MeteoGIS for Windows

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install application and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[packaging]"

      - name: Build standalone executable
        run: python -m PyInstaller --clean --noconfirm MeteoMap.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $version = "1.3.$env:GITHUB_RUN_NUMBER"
          }

          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $compiler "/DMyAppVersion=$version" "MeteoMap.iss"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload executable and installer
        uses: actions/upload-artifact@v4
        with:
          name: MeteoMap-Windows
          path: |
            dist/MeteoMap.exe
            dist/MeteoMap-Setup-*.exe
          if-no-files-found: error
