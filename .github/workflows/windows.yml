
name: Build MeteoGIS for Windows

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build MeteoGIS
        shell: pwsh
        run: |
          if (Test-Path "MeteoMap.spec") {
            python -m PyInstaller --noconfirm --clean `
              --distpath dist --workpath build "MeteoMap.spec"
          }
          elseif (Test-Path "MeteoMap.py") {
            python -m PyInstaller --noconfirm --clean `
              --windowed --onedir --name MeteoGIS `
              --distpath dist --workpath build "MeteoMap.py"
          }
          else {
            throw "MeteoMap.spec or MeteoMap.py was not found."
          }

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path "dist/MeteoMap.exe")) {
            throw "MeteoMap.exe was not found in the expected output directory."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Output | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "MeteoMap.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed."
          }

      - name: Upload application bundle
        uses: actions/upload-artifact@v4
        with:
          name: MeteoGIS-Windows-Application
          path: dist/MeteoGIS/
          if-no-files-found: error
          retention-days: 14

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MeteoGIS-Windows-Installer
          path: Output/MeteoGIS-Setup.exe
          if-no-files-found: error
          retention-days: 14
